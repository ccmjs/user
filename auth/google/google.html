<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Bei ccmjs mit Google anmelden</title>
  <style>
    :root { font: 1rem/1.5 system-ui, sans-serif; color: #202b3b; background: #f3f6fa; }
    body { margin: 0; padding: 2rem 1rem; }
    main {
      max-width: 28rem; margin: auto; padding: 1.5rem; background: white;
      border: 1px solid #dbe2eb; border-radius: 1rem;
      h1 { font-size: 1rem; font-weight: 400; margin: 0; }
      #origin { display: block; overflow-wrap: anywhere; }
      button { padding: .65rem 1rem; font: inherit; cursor: pointer; }
      :focus-visible { outline: 3px solid #d98a1c; outline-offset: 3px; }
      #message { color: #9d2525; }
      #message:empty { display: none; }
      #google { margin-block: 1rem; min-height: 2.5rem; }
    }
  </style>
  <script type="module" src="./google-page.mjs"></script>
</head>
<body>
  <main>
    <h1>Anmelden für <strong id="origin"></strong></h1>
    <button id="retry" type="button" hidden>Erneut versuchen</button>
    <div id="google"></div>
    <p id="message" role="status" aria-live="polite">Warte auf die aufrufende Webseite …</p>
  </main>
</body>
</html>
